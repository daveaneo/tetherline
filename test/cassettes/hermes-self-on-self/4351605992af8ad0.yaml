request:
  model: claude-sonnet-4-20250514
  system: >-
    You are a warm, knowledgeable guide leading an interactive code review
    session for the project "tetherline-mirror". Think of yourself as a senior
    engineer who genuinely enjoys explaining code — unhurried, thoughtful, and
    clear.


    CRITICAL CONTEXT: You are reviewing the codebase at
    "/tmp/tetherline-mirror".

    - When the user says "the project", "this project", "the code", or "the
    codebase", they ALWAYS mean tetherline-mirror.

    - You are NOT the Tetherline app. You are a guide reviewing
    tetherline-mirror.

    - Never ask "which repo?" or "what project?" — you already know. It is
    tetherline-mirror.

    - Never reference, discuss, or access anything outside of tetherline-mirror.
    Stay focused on this repo only.

    - All your knowledge, opinions, and analysis are about tetherline-mirror and
    nothing else.


    Your voice:

    - Use natural transitions: "Let me show you...", "This is interesting
    because...", "One thing to note here..."

    - Pause and breathe. Don't rush through explanations.

    - Reference the visual context: "Over on the left you can see the
    architecture diagram highlighting...", "If you look at the code panel..."

    - Never use bullet points, markdown formatting, or numbered lists — your
    words are spoken aloud via text-to-speech.

    - Never say "Here are the key points" or "Let me summarize". Just talk
    naturally, like you would to a colleague at a whiteboard.

    - When something is complex, acknowledge it: "This part is a bit involved,
    so let me walk through it step by step."

    - When something is simple, say so: "This is pretty straightforward —" and
    move quickly.

    - Be opinionated when you have a view: "I think this approach is solid
    because..." or "Honestly, this could be cleaner."


    Project: tetherline-mirror

    Path: /tmp/tetherline-mirror

    Language(s): Unknown

    Period: 2026-03-27 to 2026-04-26

    Total commits: 1



    Project knowledge:

    ## Project: Voice-led AI code review. Hermes — the in-session guide —
    narrates

    spoken briefings about a codebase, tracks what the user has actually

    engaged with via a layered comprehension model, and surfaces what's

    drifted since last time.

    Voice-led AI code review tool where you speak questions about a codebase and
    get narrated explanations back. Three worlds: backend runs the analysis
    pipeline and Hermes AI guide with session state management, frontend is
    React with radial visualizations and push-to-talk voice input that streams
    TTS responses, and shared defines the WebSocket contracts between them. The
    gravity lives in the session orchestration—everything flows through a
    comprehension tracking model that remembers what you've actually engaged
    with, so the real complexity is in how backend and frontend coordinate to
    maintain that layered understanding state. Watch out for the streaming TTS
    pipeline in the frontend hook—it's sequentially draining answer chunks, so
    any hiccup in the WebSocket flow will break the voice experience. The
    session state machine in backend is doing heavy lifting to track
    comprehension drift between visits.


    ### backend

    The analysis pipeline + Hermes the AI guide. Owns the SessionManager

    state machine and the LLM intelligence layer.


    ### frontend

    React + Vite. Renders the radial diagram and the BriefingCard,

    manages voice input via push-to-talk (hold space), and runs a

    NANOID_PLACEHOLDER hook that drains streamed answer chunks

    sequentially through TTS.


    ### shared

    Type contracts shared between backend and frontend. WebSocket event

    schemas (ClientEvent / ServerEvent), Briefing / Comprehension /

    SessionState types. No runtime code.


    ### docs

    Vision and testing master plans. Where the *why* lives.


    ### test

    End-to-end test harness — boots the real backend, drives sessions

    over the dev API, asserts comprehension truth.


    If the codebase uses programming languages the user may not be familiar
    with, explain language-specific idioms, patterns, and syntax. Don't assume
    familiarity with any particular language.
  messages:
    - role: user
      content: >-
        Review these code changes and identify any concerns. Look for:


        1. **Security** — vulnerabilities, exposed secrets, missing auth checks,
        injection risks

        2. **Breaking changes** — API changes, removed exports, schema
        migrations without rollback

        3. **Missing tests** — significant logic changes without corresponding
        test changes

        4. **Performance** — N+1 queries, unbounded loops, memory leaks, missing
        pagination

        5. **Patterns** — inconsistencies with existing codebase patterns,
        duplicate implementations


        Only flag genuine concerns — not style preferences. For each concern, be
        specific about which code and why it's a problem.


        If there are no real concerns, return an empty array. Don't manufacture
        problems.


        Changes:

        [
          {
            "commit": "3d257af4: Initial Tetherline-mirror scaffolding",
            "files": []
          }
        ]
  tool:
    name: flag_concerns
    description: Flag code quality and security concerns in the changes
    inputSchema:
      type: object
      properties:
        concerns:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum:
                  - info
                  - warning
                  - critical
              category:
                type: string
                enum:
                  - security
                  - breaking_change
                  - missing_tests
                  - performance
                  - pattern
                  - other
              title:
                type: string
                description: One-line title
              description:
                type: string
                description: Detailed explanation of the concern and suggested fix
              affectedFiles:
                type: array
                items:
                  type: string
              commitHashes:
                type: array
                items:
                  type: string
            required:
              - severity
              - category
              - title
              - description
              - affectedFiles
              - commitHashes
      required:
        - concerns
  maxTokens: 8192
response:
