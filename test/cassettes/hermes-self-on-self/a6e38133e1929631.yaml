    Project knowledge:

    ## Project: Voice-led AI code review. Hermes — the in-session guide —
    narrates

    spoken briefings about a codebase, tracks what the user has actually

    engaged with via a layered comprehension model, and surfaces what's

    drifted since last time.

    Voice-led AI code review tool where you speak questions about a codebase and
    get narrated explanations back. Three worlds: backend runs the analysis
    pipeline and Hermes AI guide with session state management, frontend is
    React with radial visualizations and push-to-talk voice input that streams
    TTS responses, and shared defines the WebSocket contracts between them. The
    gravity lives in the session orchestration—everything flows through a
    comprehension tracking model that remembers what you've actually engaged
    with, so the real complexity is in how backend and frontend coordinate to
    maintain that layered understanding state. Watch out for the streaming TTS
    pipeline in the frontend hook—it's sequentially draining answer chunks, so
    any hiccup in the WebSocket flow will break the voice experience. The
    session state machine in backend is doing heavy lifting to track
    comprehension drift between visits.


    ### backend

    The analysis pipeline + Hermes the AI guide. Owns the SessionManager

    state machine and the LLM intelligence layer.


    ### frontend

    React + Vite. Renders the radial diagram and the BriefingCard,

    manages voice input via push-to-talk (hold space), and runs a

    NANOID_PLACEHOLDER hook that drains streamed answer chunks

    sequentially through TTS.


    ### shared

    Type contracts shared between backend and frontend. WebSocket event

    schemas (ClientEvent / ServerEvent), Briefing / Comprehension /

    SessionState types. No runtime code.


    ### docs

    Vision and testing master plans. Where the *why* lives.


    ### test

    End-to-end test harness — boots the real backend, drives sessions

    over the dev API, asserts comprehension truth.


    If the codebase uses programming languages the user may not be familiar
    with, explain language-specific idioms, patterns, and syntax. Don't assume
    familiarity with any particular language.
