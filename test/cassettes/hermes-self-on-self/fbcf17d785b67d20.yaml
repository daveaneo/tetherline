    Project knowledge:

    ## Project: **Stay tethered to your codebase.**

    Interactive Reviewer lets developers get AI-powered code reviews delivered
    through voice, keeping them connected to their codebase without breaking
    flow. The system has three main worlds: a backend that caches workspace
    analysis and synthesizes spoken briefings, a voice-first frontend built
    around real-time conversation rather than text chat, and shared types that
    define the websocket protocol connecting them. The non-obvious constraint is
    that everything revolves around expensive workspace analysis that gets
    heavily cached—the system assumes you're working in the same codebase for
    extended periods, so it optimizes for that scenario but has to carefully
    detect when your files change to invalidate those caches. The frontend
    treats voice as primary and text as secondary, which is backwards from most
    code tools, and the backend spends most of its energy avoiding recomputation
    of context that takes seconds to generate fresh.


    ### backend

    This backend orchestrates AI-powered code review sessions by composing
    contextual briefings from cached workspace analysis and delivering them
    through text-to-speech. The surprising constraint is that it heavily caches
    workspace context and analysis results to avoid expensive recomputation, but
    must detect when files change to invalidate those caches appropriately. The
    `briefing/composer.ts` file does the core work of synthesizing code context,
    AI analysis, and session state into the spoken briefings that guide
    developers through their code.


    ### tetherline

    Tetherline provides a command-line interface for launching and managing the
    interactive code review system. The surprise here is that it's designed as a
    lightweight launcher rather than embedding the full application logic—the
    CLI acts more like a smart bootstrap that delegates to the core packages
    rather than reimplementing functionality. The `launcher.ts` file owns the
    actual orchestration logic, handling process management and coordination
    between the CLI surface and the underlying review engine.


    ### frontend

    The frontend module orchestrates real-time collaborative code review
    sessions through voice and visual interfaces. The twist here is that it's
    built around voice-first interactions—notice the VoiceOrb component and
    voice input hooks—treating traditional text chat as secondary to spoken
    conversation. The `NANOID_PLACEHOLDER.ts` file does the heavy coordination
    work, managing the complex state synchronization between voice input,
    WebSocket connections, and the various visual components like diff views and
    understanding heatmaps.


    ### shared

    The shared module defines the type contracts and constants that keep the
    frontend and backend speaking the same language across websocket events,
    analysis data, and UI state.


    The surprise here is how granular the type definitions get - there are
    separate type files for highly specific concepts like heatmaps, visual
    layers, and comprehension states, suggesting this isn't just basic data
    models but a sophisticated domain with nuanced interactions.


    The ws-events.ts file does the critical work of defining the websocket
    message protocol that coordinates real-time communication between the client
    and server during code review sessions.


    ### docs

    This module owns the project's planning documents and design specifications,
    capturing both current implementation strategy and future roadmap. The
    surprise here is the heavy focus on "voice" documentation—four separate
    files tracking how the AI reviewer's communication style should evolve,
    suggesting voice consistency is a core product concern rather than an
    afterthought. VISION-MASTERPLAN.md does the heaviest lifting as the central
    design document that likely defines the product's core philosophy and
    technical direction.


    ### test

    This module owns the complete testing strategy for the interactive code
    review system, spanning unit tests, integration tests, and end-to-end
    browser automation. The cassettes directory reveals that the system records
    and replays HTTP interactions for deterministic testing—those cryptic
    filenames are actually hashes of request signatures used for
    "hermes-self-on-self" scenarios where the system reviews its own codebase.
    The file `test/harness/server.ts` does the heaviest lifting by providing the
    foundational test server infrastructure that all other tests depend on,
    managing both the backend API and serving test fixtures.


    If the codebase uses programming languages the user may not be familiar
    with, explain language-specific idioms, patterns, and syntax. Don't assume
    familiarity with any particular language.
