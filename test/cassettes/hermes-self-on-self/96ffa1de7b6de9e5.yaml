    Project knowledge:

    ## Project: **Stay tethered to your codebase.**

    Interactive reviewer uses AI to generate spoken briefings that help
    developers understand codebases through voice narration. The architecture
    has three worlds: a backend that caches expensive AI-generated briefings and
    serves them via text-to-speech, a React frontend that orchestrates
    voice-driven review sessions with real-time collaboration, and shared types
    that define the WebSocket protocol binding them together. The non-obvious
    gravity here is around "sessions" and "gaps" rather than traditional code
    comments - this tool treats code review as structured conversations where
    you identify knowledge gaps and fill them collaboratively, with aggressive
    caching of the AI briefings themselves because generating coherent spoken
    explanations is apparently expensive enough to warrant a dedicated
    persistence layer. Watch out for the WebSocket event types in shared - any
    changes there cascade through both client and server real-time handlers.


    ### backend

    This module orchestrates AI-powered code review sessions by composing
    contextual briefings from cached workspace analysis and delivering them
    through text-to-speech. The surprise here is that it heavily caches not just
    the raw code analysis but the *composed briefings themselves* - there's a
    whole repository layer (`briefing-repo.ts`) dedicated to persisting these
    generated explanations, suggesting the AI processing is expensive enough to
    warrant aggressive memoization. The `briefing/composer.ts` file does the
    core work of transforming analyzed code context into coherent, spoken
    explanations that guide developers through their codebase.


    ### tetherline

    Tetherline is the CLI entry point that launches the interactive reviewer
    interface for users. The surprising constraint here is that it's just a thin
    launcher - despite being the user's primary touchpoint, it deliberately
    avoids any business logic and instead orchestrates the actual review engine
    from other packages. The file `launcher.ts` does the heaviest lifting by
    handling the command-line argument parsing and process coordination that
    bridges the user's terminal input to the core review functionality.


    ### frontend

    This module owns the React frontend for an interactive code review system
    that uses voice input and real-time collaboration. The non-obvious detail is
    that it's built around "sessions" and "gaps" - suggesting code reviews
    happen in structured sessions where reviewers identify and fill knowledge
    gaps rather than just making traditional comments. The file doing the
    heaviest lifting is `NANOID_PLACEHOLDER.ts`, which coordinates the complex
    dance between voice input, WebSocket communication, and the various state
    stores that track sessions, audio, and identified gaps.


    ### shared

    This module owns the type contracts and constants that ensure frontend and
    backend speak the same language in the interactive code review system. The
    non-obvious constraint here is that these types define a real-time
    collaborative session - notice how ws-events.ts handles WebSocket message
    typing, meaning any change here ripples through both client and server
    WebSocket handlers. The heaviest lifting happens in ws-events.ts, which owns
    the complete message protocol for real-time events like cursor movements,
    selection changes, and collaborative annotations between reviewers.


    ### docs

    This module houses the product vision and development roadmap for the
    interactive reviewer system. The surprise here is that it's heavily focused
    on "voice" documentation—multiple files tracking how the AI's communication
    style should evolve before and after fixes, suggesting this tool cares as
    much about *how* it talks to developers as what it actually does. The
    **VISION-MASTERPLAN.md** file carries the architectural weight, defining the
    core product direction that drives all the implementation planning scattered
    across the other docs.


    ### test

    This module owns the testing infrastructure for the interactive code
    reviewer, spanning unit tests, end-to-end browser automation, and
    performance measurement. The cassettes directory reveals this system uses
    VCR-style HTTP recording for deterministic API testing—those cryptic YAML
    filenames are hashed request signatures that let tests replay exact API
    interactions without hitting live services. The heaviest architectural work
    happens in `test/harness/server.ts`, which orchestrates the test server
    setup that powers both integration scenarios and the browser-based e2e
    suite.


    If the codebase uses programming languages the user may not be familiar
    with, explain language-specific idioms, patterns, and syntax. Don't assume
    familiarity with any particular language.
