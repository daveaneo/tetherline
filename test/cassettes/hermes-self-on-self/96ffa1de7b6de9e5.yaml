  tool:
    name: group_commits
    description: Group commits into semantic areas of change
    inputSchema:
      type: object
      properties:
        areas:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Descriptive name for this area of change
              description:
                type: string
                description: One paragraph explaining what changed and why
              commitHashes:
                type: array
                items:
                  type: string
                description: Short hashes of commits in this area
              significance:
                type: string
                enum:
                  - major
                  - minor
                  - maintenance
                description: Impact level
              theme:
                type: string
                description: "High-level category: Security, Performance, Data model, Testing,
                  DevOps, UI/UX, API, Documentation, or similar"
            required:
              - name
              - description
              - commitHashes
              - significance
              - theme
      required:
        - areas
  maxTokens: 8192
