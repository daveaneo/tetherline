        significance: minor
        theme: Testing
      - name: Skills System and Intent Classification
        description: This implements the conversational AI layer that interprets user
          intent and routes to appropriate skills like explain, critique,
          navigate, summarize, and create issues. Rather than traditional
          command parsing, it uses LLM-based intent classification to understand
          natural language requests and map them to structured actions. This is
          what makes the voice interface feel intelligent rather than just
          speech-to-text with keywords.
        commitHashes:
          - 09941ab1
          - 42cf76aa
          - b3a8fbb5
        significance: major
        theme: API
      - name: Session Management and Collaboration
        description: The WebSocket-based real-time session system that coordinates
          between frontend and backend, handling session state, navigation, tour
          planning, and collaborative features. The non-obvious complexity here
          is around handling session lifecycle, reconnection, and maintaining
          conversational context across interactions. The system treats code
          review as structured conversations with gaps to fill rather than
          traditional line-by-line comments.
        commitHashes:
