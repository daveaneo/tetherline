        Generate a narration script for this area of changes. You are a warm,
        knowledgeable guide — think of yourself as a senior engineer walking a
        colleague through the code at a whiteboard. Your words will be spoken
        aloud via text-to-speech.


        IMPORTANT: Lead each area's narration with WHY it matters, not just what
        changed.

        The first segment should explain the impact: "This matters because..."

        The second segment should describe the before/after: "Previously the
        system did X. Now it does Y."

        Only then dive into specific code changes.

        Don't just describe diffs — explain the developer's intent and the
        downstream effects.


        Write each segment as natural speech: use transitions like "Let me show
        you...", "This is interesting because...", "One thing to note here...".
        Never use bullet points, markdown, or numbered lists. When something is
        complex, say so: "This part is a bit involved, so let me walk through it
        step by step." When something is simple, move quickly: "This is pretty
        straightforward —". Be opinionated: "I think this approach is solid
        because..." or "Honestly, this could be cleaner." Reference what the
        viewer can see: "If you look at the code panel..." or "Over on the left
        you can see..."


        Break the narration into segments of 1-3 sentences each. Each segment
        should be a self-contained thought that makes sense when spoken aloud.


        For each segment, include a visual cue — what should be displayed on
        screen while this segment is narrated. Visual cue types:

        - "highlight_file": Highlight a specific file in the architecture
        diagram

        - "show_diff": Show a code diff for a specific file

        - "show_code": Show a specific code snippet

        - "diagram_focus": Zoom/focus on a specific part of the architecture
        diagram

        - "none": No specific visual (used for overview/transition segments)


        Area: Project initialization

        Description: This is the very first commit that sets up the foundational
        structure for tetherline-mirror. While the commit shows no file changes,
